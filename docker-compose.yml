# deepseek-vision — 使用 GitHub Container Registry 预编译镜像一键部署。
#
# 用法:
#   cp .env.example .env        # 填写 ADMIN_PASSWORD / MASTER_API_KEY / DEEPSEEK_API_KEY 等
#   docker compose up -d        # 启动
#   docker compose pull         # 拉取最新镜像后重启
services:
  deepseek-vision:
    image: ghcr.io/dijiaozhibei-top/deepseek-vision:latest
    container_name: deepseek-vision
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # 容器内固定监听端口;宿主机端口由 ${PORT:-8000} 控制
      PORT: "8000"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s